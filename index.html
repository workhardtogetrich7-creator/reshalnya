<style>
/* Layout: mobile-first single column, warm dark surfaces, gold accent, serif display + sans body; bottom tab bar like a companion reading app. Committed dark theme. */
:root{
  --bg:#f1ebdf;          /* warm paper */
  --bg-grad:#f8f2e7;
  --surface:#ffffff;     /* cards */
  --surface-2:#f6f0e6;   /* inputs, chips */
  --surface-3:#ece3d3;
  --border:rgba(60,48,28,.12);
  --border-2:rgba(60,48,28,.20);
  --text:#241d12;        /* dark ink */
  --muted:#6e6450;
  --faint:#9a8f78;
  --gold:#1f7a5a;        /* deep green accent */
  --gold-bright:#1a6a4a; /* high-contrast accent text */
  --gold-dim:rgba(31,122,90,.12);
  --good:#1f8a46;
  --good-bg:rgba(31,138,70,.12);
  --bad:#c2381b;
  --bad-bg:rgba(194,56,27,.10);
  --paper:#fbf6ec;       /* light panel behind line-art figures */
  --radius:18px;
  --radius-sm:12px;
  --nav-h:64px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  --gut-l:max(16px, env(safe-area-inset-left,0px));
  --gut-r:max(16px, env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, var(--bg-grad), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);
  min-height:100%;
}
.wrap{max-width:600px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:22px 8px}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.vec{font-style:italic;font-weight:700;white-space:nowrap}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
[hidden]{display:none!important}
::selection{background:rgba(31,122,90,.22)}

/* ---------- header / hero ---------- */
.eyebrow{color:var(--faint);font-size:13px;font-weight:500;letter-spacing:.02em;margin-bottom:6px}
.app-title{font-family:"Playfair Display",serif;font-size:clamp(30px,8.5vw,40px);line-height:1.04;font-weight:700;letter-spacing:-.01em}
.app-sub{color:var(--muted);font-size:14.5px;margin-top:8px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.overall{display:flex;align-items:center;gap:20px;padding:20px;margin-top:22px}
.ring{flex:0 0 auto}
.ring .lbl{font-family:var(--mono);font-weight:600;font-size:19px;letter-spacing:-.04em;fill:var(--text)}
.ring .lbl2{fill:var(--muted);font-size:9.5px;font-weight:600;font-family:Inter,sans-serif;letter-spacing:.08em}
.overall-txt h2{font-size:17px}
.overall-txt p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.overall-txt .accu{color:var(--gold-bright);font-weight:600}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-h h2{font-family:"Playfair Display",serif;font-size:22px;font-weight:600}
.section-h span{color:var(--faint);font-size:13px}

.vlist{display:flex;flex-direction:column;gap:12px}
.vcard{display:flex;align-items:center;gap:16px;padding:16px 18px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .18s,transform .18s,background .18s}
.vcard:hover{border-color:var(--border-2);background:var(--surface-2)}
.vcard:active{transform:scale(.993)}
.vcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.vnum{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--gold-bright)}
.vbody{flex:1 1 auto;min-width:0}
.vbody .t{font-size:16px;font-weight:600}
.vbody .s{color:var(--muted);font-size:13px;margin-top:3px}
.vbar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:3px;transition:width .4s}
.chev{flex:0 0 auto;color:var(--faint)}

/* ---------- solver ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.back:active{transform:scale(.94)}
.topbar .th{flex:1 1 auto;min-width:0}
.topbar .th .k{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
.topbar .th .m{color:var(--muted);font-size:13px;margin-top:1px}
.solve-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:14px 0 20px}
.solve-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .4s}

.tasks{display:flex;flex-direction:column;gap:11px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.task.open{border-color:var(--border-2)}
.task-h{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;background:none;border:0}
.task-h:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:-.02em;color:var(--text)}
.task-h .topic{flex:1 1 auto;min-width:0;font-size:14.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--border-2)}
.status.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.status.no{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.task-b{padding:4px 16px 18px;border-top:1px solid var(--border)}
.stmt{font-size:15.5px;line-height:1.62;margin:14px 0 0;color:var(--text)}
.stmt b{color:var(--gold-bright);font-weight:600}
.figure{margin:16px 0 4px;background:var(--paper);border-radius:var(--radius-sm);padding:14px;display:flex;justify-content:center}
.figure img{max-width:100%;height:auto;display:block}

.ans-row{display:flex;gap:10px;margin-top:18px}
.ans-row input{flex:1 1 auto;min-width:0;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);font-size:17px;font-weight:600;padding:13px 15px;border-radius:12px;outline:none;transition:border-color .15s}
.ans-row input::placeholder{color:var(--faint);font-weight:400}
.ans-row input:focus{border-color:var(--gold)}
.ans-row input.ok{border-color:var(--good)}
.ans-row input.no{border-color:var(--bad)}
.btn{flex:0 0 auto;background:linear-gradient(180deg,var(--gold),var(--gold-bright));color:#fff;font-weight:700;font-size:14.5px;white-space:nowrap;border:0;border-radius:12px;padding:0 16px;min-height:48px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--gold-bright);border:1px solid var(--border-2);font-weight:600}

.verdict{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;padding:12px 14px;border-radius:12px}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict .correct{color:var(--text);font-weight:500}
.verdict .correct b{color:var(--text)}

.sol-toggle{margin-top:14px;width:100%;background:none;border:1px solid var(--border-2);border-radius:12px;padding:12px;color:var(--gold-bright);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.solution{margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px 16px;font-size:14.5px;line-height:1.66;color:var(--text)}
.solution h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.solution p{margin:0 0 9px}
.solution p:last-child{margin-bottom:0}
.solution .res{margin-top:10px;padding-top:11px;border-top:1px solid var(--border);color:var(--gold-bright);font-weight:600}
.solution b{color:var(--gold-bright);font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.55em;text-align:center;margin:0 .12em}
.frac .n{border-bottom:1px solid currentColor;padding:0 .3em;line-height:1.25}
.frac .d{padding:0 .3em;line-height:1.25}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:4px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 12px;text-align:center}
.stat-tile .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat-tile .v.gold{color:var(--gold-bright)}
.stat-tile .l{color:var(--muted);font-size:12px;margin-top:7px}
.per-v{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.per-v .row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.per-v .row .top .nm{font-weight:600}
.per-v .row .top .fr{color:var(--muted);font-variant-numeric:tabular-nums}
.per-v .track{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.per-v .track .okseg{background:linear-gradient(90deg,var(--good),#46a56d);height:100%}
.per-v .track .noseg{background:var(--bad);height:100%;opacity:.85}

/* ---------- more ---------- */
.more-card{padding:18px;margin-top:4px}
.more-card h3{font-size:16px;margin-bottom:6px}
.more-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.danger{color:var(--bad);border:1px solid var(--bad-bg);background:var(--bad-bg);border-radius:12px;padding:13px;width:100%;font-weight:600;margin-top:14px}
.confirm-row{display:flex;gap:10px;margin-top:12px}
.confirm-row button{flex:1 1 0;padding:12px;border-radius:11px;font-weight:600;font-size:14px}
.confirm-row .yes{background:var(--bad);color:#fff;border:0}
.confirm-row .no{background:var(--surface-2);color:var(--text);border:1px solid var(--border-2)}
.about-link{color:var(--gold-bright);text-decoration:none;font-weight:600}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,245,237,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{flex:1 1 0;height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:11px;font-weight:500;transition:color .15s}
.nav button svg{width:23px;height:23px}
.nav button.active{color:var(--gold-bright)}

.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------------- STATE ---------------- */
const LS_KEY='reshalnya_progress_v1';
let store={};
try{store=JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){store={};}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
function tkey(v,n){return v+'-'+n;}
function getT(v,n){return store[tkey(v,n)]||{};}
function setT(v,n,o){store[tkey(v,n)]=Object.assign(getT(v,n),o);save();}

let tab='variants';
let openVariant=null;   // variant id when solving
let openTask=null;      // task n expanded

/* ---------------- HELPERS ---------------- */
function norm(s){return String(s).trim().toLowerCase().replace(/−/g,'-').replace(',', '.').replace(/\s+/g,'');}
function isCorrect(user,ans){
  if(user==null) return false;
  const u=norm(user), a=norm(ans);
  if(u==='') return false;
  if(u===a) return true;
  const numRe=/^-?(\d+\.?\d*|\.\d+)$/;      // whole string must be a clean number
  if(numRe.test(u)&&numRe.test(a)) return Math.abs(parseFloat(u)-parseFloat(a))<1e-9;
  return false;
}
function variantStats(v){
  const vt=DATA.find(x=>x.id===v).tasks;
  let solved=0,correct=0;
  vt.forEach(t=>{const s=getT(v,t.n);if(s.checked){solved++;if(s.correct)correct++;}});
  return{solved,correct,total:vt.length};
}
function overallStats(){
  let solved=0,correct=0,total=0;
  DATA.forEach(vv=>{const s=variantStats(vv.id);solved+=s.solved;correct+=s.correct;total+=s.total;});
  return{solved,correct,total};
}
function ringSVG(frac,center,sub){
  const r=34,c=2*Math.PI*r,off=c*(1-frac);
  return `<svg class="ring" width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="8"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold-bright)"/></linearGradient></defs>
    <text class="lbl" x="46" y="44" text-anchor="middle" dominant-baseline="middle">${center}</text>
    <text class="lbl2" x="46" y="60" text-anchor="middle">${sub}</text></svg>`;
}

  if(openVariant!==null){app.innerHTML=renderSolver();bindSolver();}
  else if(tab==='variants'){app.innerHTML=renderHome();bindHome();}
  else if(tab==='stats'){app.innerHTML=renderStats();}
  else {app.innerHTML=renderMore();bindMore();}
  app.firstElementChild&&app.firstElementChild.classList.add('fade');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab&&openVariant===null));
}

function renderHome(){
  const o=overallStats();
  const frac=o.total?o.solved/o.total:0;
  const acc=o.solved?Math.round(o.correct/o.solved*100):0;
  let cards=DATA.map(v=>{
    const s=variantStats(v.id);
    const fr=s.total?s.solved/s.total:0;
    return `<button class="vcard" data-v="${v.id}">
      <span class="vnum">${v.id}</span>
      <span class="vbody">
        <span class="t">${v.title}</span>
        <span class="s">${s.solved}/${s.total} решено${s.solved?` · ${s.correct} верно`:''}</span>
        <span class="vbar"><i style="width:${(fr*100).toFixed(0)}%"></i></span>
      </span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>`;}).join('');
  return `
    <div class="eyebrow">Профильная математика</div>
    <h1 class="app-title">Решальня</h1>
    <p class="app-sub">Прорешивай варианты Ященко: вводи ответ, проверяй и разбирай решение по шагам.</p>
    <div class="card overall">
      ${ringSVG(frac, o.solved+'/'+o.total, 'РЕШЕНО')}
      <div class="overall-txt">
        <h2>Общий прогресс</h2>
        <p>${o.solved?`Верно <span class="accu">${acc}%</span> из решённых. Так держать.`:'Начни с любого варианта — ответы сверяются мгновенно.'}</p>
      </div>
    </div>
    <div class="section-h"><h2>Варианты</h2><span>${DATA.length} доступно</span></div>
    <div class="vlist">${cards}</div>`;
}
function bindHome(){
  document.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>{openVariant=+b.dataset.v;openTask=null;render();window.scrollTo(0,0);});
}

function renderSolver(){
  const v=DATA.find(x=>x.id===openVariant);
  const s=variantStats(v.id);
  const fr=s.total?s.solved/s.total:0;
  let rows=v.tasks.map(t=>{
    const st=getT(v.id,t.n);
    const open=openTask===t.n;
    let statusCls='',statusIco='<span style="color:var(--faint);font-size:12px">—</span>';
    if(st.checked&&st.correct){statusCls='ok';statusIco='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';}
    else if(st.checked){statusCls='no';statusIco='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';}
    let body='';
    if(open){
      const fig=t.img?`<div class="figure"><img src="${IMG[t.img]||''}" alt="Рисунок к заданию ${t.n}"></div>`:'';
      const val=st.answer!=null?st.answer:'';
      let verdict='';
      if(st.checked){
        verdict=st.correct
          ?`<div class="verdict ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Верно</div>`
          :`<div class="verdict no"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg> <span>Неверно. <span class="correct">Ответ: <b>${t.ans.replace('.',',')}</b></span></span></div>`;
      }
      const sol=st.revealed?`<div class="solution"><h4>Решение</h4>${t.sol}</div>`:'';
      const inpCls=st.checked?(st.correct?'ok':'no'):'';
      body=`<div class="task-b">
        <p class="stmt">${t.stmt}</p>
        ${fig}
        <div class="ans-row">
          <input id="inp-${t.n}" class="${inpCls}" inputmode="text" autocomplete="off" placeholder="Ваш ответ" value="${String(val).replace(/"/g,'&quot;')}">
          <button class="btn" data-check="${t.n}">Проверить</button>
        </div>
        ${verdict}
        <button class="sol-toggle" data-sol="${t.n}">${st.revealed?'Скрыть решение':'Показать решение'}</button>
        ${sol}
      </div>`;
    }
    return `<div class="task ${open?'open':''}">
      <button class="task-h" data-task="${t.n}">
        <span class="tn">${t.n}</span>
        <span class="topic">${t.topic}</span>
        <span class="status ${statusCls}">${statusIco}</span>
      </button>
      ${body}
    </div>`;
  }).join('');
  return `
    <div class="topbar">
      <button class="back" id="back" aria-label="Назад к вариантам">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="th"><div class="k">${v.title}</div><div class="m">${s.solved}/${s.total} решено${s.solved?` · ${s.correct} верно`:''}</div></div>
    </div>
    <div class="solve-bar"><i style="width:${(fr*100).toFixed(0)}%"></i></div>
    <div class="tasks">${rows}</div>`;
}
function bindSolver(){
  document.getElementById('back').onclick=()=>{openVariant=null;openTask=null;render();window.scrollTo(0,0);};
  document.querySelectorAll('.task-h').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.task; openTask=openTask===n?null:n; render();
  });
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.check; const inp=document.getElementById('inp-'+n);
    const v=DATA.find(x=>x.id===openVariant); const t=v.tasks.find(x=>x.n===n);
    const correct=isCorrect(inp.value,t.ans);
    setT(openVariant,n,{answer:inp.value,checked:true,correct});
    render();
  });
  document.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.sol; const st=getT(openVariant,n);
    setT(openVariant,n,{revealed:!st.revealed}); render();
  });
  const inp=openTask!=null?document.getElementById('inp-'+openTask):null;
  if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const btn=document.querySelector('[data-check="'+openTask+'"]');btn&&btn.click();}});}
}

function renderStats(){
  const o=overallStats();
  const acc=o.solved?Math.round(o.correct/o.solved*100):0;
  let rows=DATA.map(v=>{
    const s=variantStats(v.id);
    const okp=s.total?s.correct/s.total*100:0;
    const nop=s.total?(s.solved-s.correct)/s.total*100:0;
    return `<div class="row">
      <div class="top"><span class="nm">${v.title}</span><span class="fr">${s.solved}/${s.total}${s.solved?` · ${s.correct} верно`:''}</span></div>
      <div class="track"><span class="okseg" style="width:${okp}%"></span><span class="noseg" style="width:${nop}%"></span></div>
    </div>`;}).join('');
  return `
    <div class="eyebrow">Твои результаты</div>
    <h1 class="app-title serif" style="font-size:32px">Статистика</h1>
    <div class="stat-grid" style="margin-top:20px">
      <div class="stat-tile"><div class="v">${o.solved}</div><div class="l">решено из ${o.total}</div></div>
      <div class="stat-tile"><div class="v gold">${o.correct}</div><div class="l">верно</div></div>
      <div class="stat-tile"><div class="v">${acc}<span style="font-size:18px">%</span></div><div class="l">точность</div></div>
    </div>
    <div class="section-h"><h2>По вариантам</h2></div>
    <div class="per-v">${rows}</div>`;
}

function renderMore(){
  return `
    <div class="eyebrow">Настройки</div>
    <h1 class="app-title serif" style="font-size:32px">Ещё</h1>
    <div class="card more-card" style="margin-top:20px">
      <h3>О приложении</h3>
      <p>«Решальня» — тренажёр по профильной математике ЕГЭ. Сейчас доступно ${DATA.length} варианта (1, 5, 6) из сборника Ященко: условия, мгновенная проверка ответа и разбор решения по шагам. Прогресс хранится в этом браузере.</p>
    </div>
    <div class="card more-card">
      <h3>Сбросить прогресс</h3>
      <p>Удалит все введённые ответы и отметки. Отменить нельзя.</p>
      <div id="reset-area"><button class="danger" id="reset-btn">Сбросить прогресс</button></div>
    </div>
    <div class="card more-card">
      <h3>Компаньон</h3>
      <p>Приложение сделано в пару к <a class="about-link" href="https://workhardtogetrich7-creator.github.io/chitalnya/" target="_blank" rel="noopener">«Читальне»</a> — трекеру чтения для итогового сочинения.</p>
    </div>`;
}
function bindMore(){
  const btn=document.getElementById('reset-btn');
  if(btn)btn.onclick=()=>{
    document.getElementById('reset-area').innerHTML=
      `<p style="color:var(--text);font-size:14px;margin:0">Точно сбросить весь прогресс?</p>
       <div class="confirm-row"><button class="yes" id="yes">Да, сбросить</button><button class="no" id="no">Отмена</button></div>`;
    document.getElementById('yes').onclick=()=>{store={};save();render();};
    document.getElementById('no').onclick=()=>render();
  };
}

/* ---------------- NAV ---------------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; openVariant=null; openTask=null; render(); window.scrollTo(0,0);
});
render();
</script>
